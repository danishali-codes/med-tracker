name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  apk:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
      # With the signing secrets set, every build is signed with the same private key so
      # new versions install over old ones. Without them it falls back to the shared debug key.
      - name: Use the app's signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          node scripts/use-release-key.js
      - name: Build the APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Name the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/med-tracker-${GITHUB_SHA::7}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: med-tracker-apk
          path: dist/*.apk
          retention-days: 30

  # Installs the APK on an Android emulator, opens it and fails if the app crashes,
  # printing the crash log. Catches release-only problems (like code shrinking) before a phone does.
  launch:
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: med-tracker-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Open the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r apk/*.apk
            adb logcat -c
            adb shell monkey -p com.danishalicodes.medtracker -c android.intent.category.LAUNCHER 1
            sleep 30
            adb exec-out screencap -p > screenshot.png || true
            adb logcat -d -v brief AndroidRuntime:E ReactNativeJS:V '*:S' > crash.txt || true
            cat crash.txt
            adb shell pidof com.danishalicodes.medtracker && echo "App is running" || (echo "App crashed" && exit 1)
            if grep -q "FATAL EXCEPTION" crash.txt; then echo "Crash found in log" && exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-screenshot
          path: screenshot.png
          if-no-files-found: ignore

  # Every merge to main updates a "latest" release, so the newest APK is
  # always at the same link and easy to download on the phone.
  release:
    needs: launch
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: med-tracker-apk
          path: dist
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/*.apk --target "$GITHUB_SHA" --title "Latest build" --notes "Built from ${GITHUB_SHA::7}. Download the .apk on your Android phone and open it to install."
      - uses: actions/checkout@v4
        with:
          path: repo
      # One release per version in CHANGELOG.md (v0.1.0, v0.2.0, v0.5.1...), with its notes
      # and screenshots. The APK is attached to the version that matches app.json. For a
      # version that already has a release, the screenshots zip (and the APK, for the
      # current version) are re-uploaded, so retaken screenshots reach old releases too.
      - name: Publish version releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          current=$(node -p "require('./repo/app.json').expo.version.replace(/\.0$/, '')")
          node repo/scripts/release-notes.js repo/CHANGELOG.md | while read -r line; do
            version=$(echo "$line" | jq -r .version)
            tag=$(echo "$line" | jq -r .tag)
            commit=$(echo "$line" | jq -r '.commit // empty')
            files=()
            if [ -d "repo/docs/screenshots/$version" ]; then
              rm -f "$GITHUB_WORKSPACE/screenshots-$version.zip"
              (cd "repo/docs/screenshots/$version" && zip -q "$GITHUB_WORKSPACE/screenshots-$version.zip" *.png)
              files+=("screenshots-$version.zip")
            fi
            if [ "$version" = "$current" ]; then
              cp dist/*.apk "sabr-$version.apk"
              files+=("sabr-$version.apk")
            fi
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag exists, refreshing its files"
              # APKs used to be named med-tracker-x.y.apk; don't leave a stale one next to the new one.
              [ "$version" = "$current" ] && { gh release delete-asset "$tag" "med-tracker-$version.apk" -y 2>/dev/null || true; }
              [ ${#files[@]} -gt 0 ] && gh release upload "$tag" "${files[@]}" --clobber
              continue
            fi
            echo "$line" | jq -r .notes > notes.md
            latest=--latest=false
            [ "$version" = "$current" ] && latest=--latest
            gh release create "$tag" "${files[@]}" --target "${commit:-$GITHUB_SHA}" --title "Sabr $version" --notes-file notes.md $latest
          done
