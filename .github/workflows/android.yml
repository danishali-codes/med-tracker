name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  apk:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Name the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/med-tracker-${GITHUB_SHA::7}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: med-tracker-apk
          path: dist/*.apk
          retention-days: 30
      # Every merge to main updates a "latest" release, so the newest APK is
      # always at the same link and easy to download on the phone.
      - name: Publish latest release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/*.apk --title "Latest build" --notes "Built from ${GITHUB_SHA::7}. Download the .apk on your Android phone and open it to install." --latest
