name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  apk:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Name the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/med-tracker-${GITHUB_SHA::7}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: med-tracker-apk
          path: dist/*.apk
          retention-days: 30

  # Installs the APK on an Android emulator, opens it and fails if the app crashes,
  # printing the crash log. Catches release-only problems (like code shrinking) before a phone does.
  launch:
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: med-tracker-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Open the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r apk/*.apk
            adb logcat -c
            adb shell monkey -p com.danishalicodes.medtracker -c android.intent.category.LAUNCHER 1
            sleep 30
            adb exec-out screencap -p > screenshot.png || true
            adb logcat -d -v brief AndroidRuntime:E ReactNativeJS:V '*:S' > crash.txt || true
            cat crash.txt
            adb shell pidof com.danishalicodes.medtracker && echo "App is running" || (echo "App crashed" && exit 1)
            if grep -q "FATAL EXCEPTION" crash.txt; then echo "Crash found in log" && exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-screenshot
          path: screenshot.png
          if-no-files-found: ignore

  # Every merge to main updates a "latest" release, so the newest APK is
  # always at the same link and easy to download on the phone.
  release:
    needs: launch
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: med-tracker-apk
          path: dist
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/*.apk --target "$GITHUB_SHA" --title "Latest build" --notes "Built from ${GITHUB_SHA::7}. Download the .apk on your Android phone and open it to install." --latest
