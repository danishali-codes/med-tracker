name: Layout check

# Shoots every screen scrolled top to bottom, in dark mode, as the phone comes and with
# big text on a narrow screen, with a gold day on Today. The pictures are saved to
# docs/screenshots/layout-check/ on the branch for review. Run by hand, or when these
# tools change.
on:
  push:
    branches-ignore: [main]
    paths:
      - scripts/screenshots/layout-check.sh
      - scripts/screenshots/screens-layout.txt
      - .github/workflows/layout-check.yml
  workflow_dispatch:

concurrency:
  group: layout-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shoot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Add demo data with a gold day
        run: |
          cp scripts/screenshots/demo-seed.ts src/demo-seed.ts
          # Imports run before any other code in index.ts, so the flag is set by a module of its own, imported first.
          echo "(globalThis as { __DEMO_GOLD?: boolean }).__DEMO_GOLD = true;" > src/demo-gold.ts
          printf "import './src/demo-gold';\nimport './src/demo-seed';\n%s\n" "$(cat index.ts)" > index.ts
          echo "PKG=$(node -p "require('./app.json').expo.android.package")" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - run: ./gradlew assembleRelease --no-daemon -Dorg.gradle.internal.repository.max.retries=8 -Dorg.gradle.internal.repository.initial.backoff=2000
        working-directory: android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: bash scripts/screenshots/layout-check.sh android/app/build/outputs/apk/release/app-release.apk shots scripts/screenshots/screens-layout.txt ${{ env.PKG }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-check
          path: shots/
      - name: Commit the pictures to the branch
        if: github.ref != 'refs/heads/main'
        run: |
          git fetch origin "${{ github.ref_name }}" && git checkout -B "${{ github.ref_name }}" FETCH_HEAD
          rm -rf docs/screenshots/layout-check && mkdir -p docs/screenshots/layout-check
          cp shots/*.png shots/log.txt docs/screenshots/layout-check/ 2>/dev/null || true
          git add docs/screenshots/layout-check
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git -c user.name=danishali-codes -c user.email=76103337+danishali-codes@users.noreply.github.com commit -m "Layout check screenshots"
          git push origin "${{ github.ref_name }}"
    permissions:
      contents: write
