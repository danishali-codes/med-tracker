name: Screenshots

# Builds each app version with demo data and saves screenshots of every screen,
# light and dark, so versions can be compared side by side. The images are kept
# in docs/screenshots/<version>/. Runs when the screenshot tools change, or by hand.
on:
  push:
    branches-ignore: [main]
    paths:
      - scripts/screenshots/**
      - .github/workflows/screenshots.yml
  workflow_dispatch:

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shoot:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Released versions are pinned to their commit; "current" is this push.
          - key: '0.1'
            ref: c22ec81cf21bd9634260f4d9885a3cba65dd3019
          - key: '0.2'
            ref: b93ed248d30b6928f5613d150c4256930a4966a0
          - key: current
            ref: ''
    steps:
      - uses: actions/checkout@v4
        with:
          path: tools
      - uses: actions/checkout@v4
        with:
          path: app
          ref: ${{ matrix.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Read the version
        run: echo "VERSION=$(node -p "require('./app/app.json').expo.version.replace(/\\.0$/, '')")" >> "$GITHUB_ENV"
      - name: Add demo data
        working-directory: app
        run: |
          cp ../tools/scripts/screenshots/demo-seed.ts src/demo-seed.ts
          printf "import './src/demo-seed';\n%s\n" "$(cat index.ts)" > index.ts
          head -3 index.ts
      - run: npm ci
        working-directory: app
      - run: npx expo prebuild --platform android --no-install
        working-directory: app
      - run: ./gradlew assembleRelease --no-daemon
        working-directory: app/android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: bash tools/scripts/screenshots/capture.sh app/android/app/build/outputs/apk/release/app-release.apk shots/${{ env.VERSION }} tools/scripts/screenshots/screens-${{ matrix.key }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.key }}
          path: shots/
          if-no-files-found: warn

  # Commits the new screenshots to docs/screenshots/<version>/ on the same branch,
  # so they show up in the pull request (and in the README and release notes once merged).
  save:
    needs: shoot
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          pattern: screenshots-*
          path: shots
          merge-multiple: true
      - name: Commit screenshots
        run: |
          for dir in shots/*/; do
            v=$(basename "$dir")
            mkdir -p "docs/screenshots/$v"
            cp "$dir"*.png "docs/screenshots/$v/" 2>/dev/null || true
          done
          git add docs/screenshots
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git -c user.name=danishali-codes -c user.email=76103337+danishali-codes@users.noreply.github.com commit -m "Update screenshots"
          git push
